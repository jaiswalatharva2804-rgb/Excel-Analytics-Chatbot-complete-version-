<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Excel Analytics Chatbot</title>

    <!-- Markdown Renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 800px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ddd;
        }

        h2 {
            text-align: center;
        }

        input, button {
            padding: 12px;
            margin: 6px 0;
            width: 100%;
            font-size: 16px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #chat-box {
            border: 1px solid #ddd;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            margin-top: 15px;
            background: #fafafa;
        }

        .user {
            background: #eef2ff;
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
        }

        .bot {
            background: #ecfdf5;
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
        }

        .bot h1, .bot h2, .bot h3 {
            margin-top: 10px;
        }

        .bot ul {
            margin-left: 25px;
        }

        .bot code {
            background: #e5e7eb;
            padding: 4px 6px;
            border-radius: 4px;
        }

        .status {
            font-weight: bold;
            margin-top: 5px;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>📊 Excel Analytics Chatbot</h2>

    <!-- Upload Section -->

    <h3>Upload File</h3>

    <input type="file" id="file">

    <button onclick="uploadFile()">Upload</button>

    <div id="upload-status" class="status"></div>

    <hr>

    <!-- Chat Section -->

    <h3>Ask Questions</h3>

    <input type="text" id="question" placeholder="Type your question...">

    <button onclick="askQuestion()">Ask</button>

    <div id="chat-box"></div>

</div>


<script>


// Upload File
async function uploadFile() {

    const fileInput = document.getElementById("file");
    const status = document.getElementById("upload-status");

    if (!fileInput.files[0]) {
        alert("Please select a file!");
        return;
    }

    const formData = new FormData();

    formData.append("file", fileInput.files[0]);


    const res = await fetch("/upload", {
        method: "POST",
        body: formData
    });


    const data = await res.json();


    if (data.success) {
        status.innerHTML = "✅ File loaded successfully!";
        status.style.color = "green";
    }
    else {
        status.innerHTML = "❌ " + data.error;
        status.style.color = "red";
    }

}



// Ask Question
async function askQuestion() {

    const input = document.getElementById("question");
    const chatBox = document.getElementById("chat-box");

    const question = input.value.trim();

    if (!question) return;


    // Show user message
    chatBox.innerHTML += `
        <div class="user">
            <b>You:</b><br>${question}
        </div>
    `;


    input.value = "";


    const res = await fetch("/ask", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            question: question
        })
    });


    const data = await res.json();


    if (data.success) {

        // Render Markdown
        const formatted = marked.parse(
            data.data.answer.replace(/\n/g, "\n\n")
        );

        chatBox.innerHTML += `
            <div class="bot">
                <b>Bot:</b><br>${formatted}
            </div>
        `;

    }
    else {

        chatBox.innerHTML += `
            <div class="bot">
                <b>Error:</b> ${data.error}
            </div>
        `;

    }


    chatBox.scrollTop = chatBox.scrollHeight;

}


</script>

</body>
</html>
